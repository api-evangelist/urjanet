openapi: 3.2.0
info:
  title: Urjanet Utility Cloud Webhooks API
  description: REST API for the Urjanet (now part of Arcadia) utility-data aggregation platform, also branded as the Arcadia "Arc" / Utility Cloud platform.
  termsOfService: https://urjanet.com/terms-of-service/
  contact:
    name: Arcadia / Urjanet Support
    url: https://docs.arcadia.com/v1.0-Utility-Cloud/reference/introduction
  version: '1.0'
servers:
- url: https://api.urjanet.com
  description: Urjanet / Arcadia Utility Cloud production API base URL.
security:
- bearerAuth: []
tags:
- name: Webhooks
paths:
  /Organization/{organizationId}:
    patch:
      operationId: updateOrganization
      tags:
      - Webhooks
      summary: Update organization (including webhook configuration)
      description: Update organization settings, including webhook endpoint configuration used to receive notifications on important events such as new data availability or credential status changes. Request schema not publicly documented in full.
      parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
        description: Identifier of the organization to update.
      responses:
        '200':
          description: The updated organization.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token obtained from POST /auth/login, sent in the Authorization header as "Bearer {token}".
